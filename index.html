<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>歌手錄音</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      color: #7048a8;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    #startBtn {
      background: #7048a8;
      color: white;
    }

    #stopBtn {
      background: #d9c9e8;
      color: #54356f;
    }

    #uploadBtn {
      background: #8b5fbf;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #7048a8;
      margin: 22px 0 5px;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      line-height: 1.6;
      color: #666;
    }

    audio {
      width: 100%;
      margin-top: 18px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #7048a8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎙️ 歌手錄音</h1>

  <div class="subtitle">
    錄下你的歌曲並儲存
  </div>

  <div class="box">

    <label>歌手</label>
    <input
      id="singer"
      type="text"
      placeholder="例如：周杰倫"
    >

    <label>歌名</label>
    <input
      id="song"
      type="text"
      placeholder="例如：晴天"
    >

    <label>錄音者</label>
    <input
      id="recorder"
      type="text"
      placeholder="輸入你的名字"
    >

    <div
      id="timer"
      class="timer"
    >
      00:00
    </div>

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙️ 開始錄音
    </button>

    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹️ 結束錄音
    </button>

    <audio
      id="audio"
      controls
      style="display:none;"
    ></audio>

    <button
      id="uploadBtn"
      onclick="uploadRecording()"
      disabled
    >
      ☁️ 上傳錄音
    </button>

    <div
      id="status"
      class="status"
    >
      填好資料後即可開始錄音
    </div>

  </div>

  <a
    class="back"
    href="https://script.google.com/"
  >
    ← 返回
  </a>

</div>


<script>

  // ==========================================
  // Google Apps Script 上傳網址
  // ==========================================

  const UPLOAD_URL =
    "https://script.google.com/macros/s/AKfycbzMO0D-Qd6reE74-NZSrLQanj-FI0UdnA2sK_lcNCz5R9KIIEYSchLvJFRsbva8rvbE2w/exec";


  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;

  let timerInterval = null;
  let seconds = 0;


  // ==========================================
  // 開始錄音
  // ==========================================

  async function startRecording() {

    const singer =
      document.getElementById("singer").value.trim();

    const song =
      document.getElementById("song").value.trim();

    const recorder =
      document.getElementById("recorder").value.trim();


    if (!singer || !song || !recorder) {

      setStatus(
        "⚠️ 請先填寫歌手、歌名和錄音者。"
      );

      return;
    }


    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      audioChunks = [];

      audioBlob = null;


      mediaRecorder =
        new MediaRecorder(stream, {
          mimeType: getSupportedMimeType()
        });


      mediaRecorder.ondataavailable =
        function(event) {

          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }

        };


      mediaRecorder.onstop =
        function() {

          audioBlob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          const audio =
            document.getElementById("audio");


          audio.src =
            URL.createObjectURL(audioBlob);

          audio.style.display = "block";


          document.getElementById("uploadBtn")
            .disabled = false;


          setStatus(
            "✅ 錄音完成，可以播放或上傳。"
          );

        };


      mediaRecorder.start();

      stream.getTracks().forEach(
        track => {
          track.addEventListener(
            "ended",
            function() {}
          );
        }
      );


      document.getElementById("startBtn")
        .disabled = true;

      document.getElementById("stopBtn")
        .disabled = false;

      document.getElementById("uploadBtn")
        .disabled = true;


      seconds = 0;

      updateTimer();


      timerInterval =
        setInterval(
          updateTimer,
          1000
        );


      setStatus(
        "🔴 正在錄音……最多 20 秒"
      );


      // 最長 20 秒

      setTimeout(
        function() {

          if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
          ) {
            stopRecording();
          }

        },
        20000
      );


    } catch (error) {

      setStatus(
        "❌ 無法使用麥克風。請確認 Safari 已允許此網站使用麥克風。"
      );

    }

  }


  // ==========================================
  // 結束錄音
  // ==========================================

  function stopRecording() {

    if (
      !mediaRecorder ||
      mediaRecorder.state !== "recording"
    ) {
      return;
    }


    mediaRecorder.stop();


    document.getElementById("startBtn")
      .disabled = false;

    document.getElementById("stopBtn")
      .disabled = true;


    clearInterval(timerInterval);

    document
      .getElementById("timer")
      .textContent = formatTime(seconds);

  }


  // ==========================================
  // 上傳錄音
  // ==========================================

  async function uploadRecording() {

    if (!audioBlob) {

      setStatus(
        "⚠️ 目前沒有錄音。"
      );

      return;
    }


    const singer =
      document.getElementById("singer").value.trim();

    const song =
      document.getElementById("song").value.trim();

    const recorder =
      document.getElementById("recorder").value.trim();


    if (!singer || !song || !recorder) {

      setStatus(
        "⚠️ 請確認資料都已填寫。"
      );

      return;
    }


    const uploadBtn =
      document.getElementById("uploadBtn");


    uploadBtn.disabled = true;


    setStatus(
      "☁️ 正在上傳錄音，請稍候……"
    );


    try {

      const dataUrl =
        await blobToDataURL(audioBlob);


      const fileName =
        sanitizeFileName(
          singer +
          "_" +
          song +
          "_" +
          recorder +
          "_" +
          Date.now() +
          ".webm"
        );


      const formData =
        new URLSearchParams();


      formData.append(
        "dataUrl",
        dataUrl
      );

      formData.append(
        "fileName",
        fileName
      );

      formData.append(
        "singer",
        singer
      );

      formData.append(
        "song",
        song
      );

      formData.append(
        "recorder",
        recorder
      );


      await fetch(
        UPLOAD_URL,
        {
          method: "POST",
          mode: "no-cors",
          body: formData
        }
      );


      setStatus(
        "✅ 錄音已送出！"
      );


    } catch (error) {

      uploadBtn.disabled = false;

      setStatus(
        "❌ 上傳失敗：" +
        error.message
      );

    }

  }


  // ==========================================
  // Blob → Base64
  // ==========================================

  function blobToDataURL(blob) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onloadend =
          function() {
            resolve(reader.result);
          };


        reader.onerror =
          reject;


        reader.readAsDataURL(blob);

      }
    );

  }


  // ==========================================
  // 找瀏覽器支援的錄音格式
  // ==========================================

  function getSupportedMimeType() {

    const types = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];


    for (const type of types) {

      if (
        MediaRecorder.isTypeSupported(type)
      ) {
        return type;
      }

    }


    return "";

  }


  // ==========================================
  // 計時
  // ==========================================

  function updateTimer() {

    document
      .getElementById("timer")
      .textContent =
      formatTime(seconds);

    seconds++;

  }


  function formatTime(totalSeconds) {

    const minutes =
      Math.floor(totalSeconds / 60);

    const secs =
      totalSeconds % 60;


    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0")
    );

  }


  // ==========================================
  // 狀態文字
  // ==========================================

  function setStatus(text) {

    document
      .getElementById("status")
      .textContent = text;

  }


  // ==========================================
  // 檔名處理
  // ==========================================

  function sanitizeFileName(name) {

    return name
      .replace(/[\\/:*?"<>|]/g, "_");

  }

</script>

</body>
</html>
