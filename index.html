<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>歌手錄音</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3fb;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      color: #7048a8;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    #start {
      background: #7048a8;
      color: white;
    }

    #stop {
      background: #ddd0e8;
      color: #55366d;
    }

    #send {
      background: #8b5fbf;
      color: white;
    }

    button:disabled {
      opacity: .45;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      color: #7048a8;
      margin: 22px 0;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #666;
      margin-top: 18px;
      line-height: 1.6;
    }

    audio {
      width: 100%;
      margin-top: 18px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🎙️ 歌手錄音</h1>

  <div class="subtitle">
    錄完後會傳回歌手資料庫
  </div>


  <div class="box">

    <label>歌手</label>

    <input
      id="singer"
      placeholder="例如：周杰倫"
    >


    <label>歌名</label>

    <input
      id="song"
      placeholder="例如：晴天"
    >


    <label>錄音者</label>

    <input
      id="recorder"
      placeholder="輸入你的名字"
    >


    <div
      id="timer"
      class="timer"
    >
      00:00
    </div>


    <button
      id="start"
      onclick="startRecording()"
    >
      🎙️ 開始錄音
    </button>


    <button
      id="stop"
      onclick="stopRecording()"
      disabled
    >
      ⏹️ 結束錄音
    </button>


    <audio
      id="audio"
      controls
      style="display:none"
    ></audio>


    <button
      id="send"
      onclick="sendRecording()"
      disabled
    >
      📤 傳回資料庫
    </button>


    <div
      id="status"
      class="status"
    >
      填好資料後開始錄音
    </div>

  </div>

</div>


<script>

  let recorder = null;

  let chunks = [];

  let audioBlob = null;

  let stream = null;

  let timer = null;

  let seconds = 0;


  // =====================================
  // 開始
  // =====================================

  async function startRecording() {

    const singer =
      document.getElementById('singer')
        .value.trim();

    const song =
      document.getElementById('song')
        .value.trim();

    const recorderName =
      document.getElementById('recorder')
        .value.trim();


    if (
      !singer ||
      !song ||
      !recorderName
    ) {

      setStatus(
        '⚠️ 請先填寫歌手、歌名和錄音者。'
      );

      return;
    }


    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      chunks = [];

      audioBlob = null;


      const mimeType =
        getMimeType();


      recorder =
        mimeType
          ? new MediaRecorder(
              stream,
              { mimeType: mimeType }
            )
          : new MediaRecorder(stream);


      recorder.ondataavailable =
        function(event) {

          if (event.data.size > 0) {
            chunks.push(event.data);
          }

        };


      recorder.onstop =
        function() {

          audioBlob =
            new Blob(
              chunks,
              {
                type:
                  recorder.mimeType ||
                  'audio/webm'
              }
            );


          const audio =
            document.getElementById('audio');


          audio.src =
            URL.createObjectURL(
              audioBlob
            );


          audio.style.display =
            'block';


          document
            .getElementById('send')
            .disabled = false;


          setStatus(
            '✅ 錄音完成，可以播放或傳回資料庫。'
          );

        };


      recorder.start();


      document
        .getElementById('start')
        .disabled = true;


      document
        .getElementById('stop')
        .disabled = false;


      document
        .getElementById('send')
        .disabled = true;


      seconds = 0;

      updateTimer();


      timer =
        setInterval(
          updateTimer,
          1000
        );


      setStatus(
        '🔴 正在錄音……最多 20 秒'
      );


      setTimeout(
        function() {

          if (
            recorder &&
            recorder.state === 'recording'
          ) {
            stopRecording();
          }

        },
        20000
      );


    } catch (error) {

      setStatus(
        '❌ 無法使用麥克風，請確認 Safari 已允許麥克風。'
      );

    }

  }


  // =====================================
  // 結束
  // =====================================

  function stopRecording() {

    if (
      !recorder ||
      recorder.state !== 'recording'
    ) {
      return;
    }


    recorder.stop();


    if (stream) {

      stream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

    }


    clearInterval(timer);


    document
      .getElementById('start')
      .disabled = false;


    document
      .getElementById('stop')
      .disabled = true;

  }


  // =====================================
  // 傳回 Apps Script
  // =====================================

  async function sendRecording() {

    if (!audioBlob) {

      setStatus(
        '⚠️ 沒有錄音。'
      );

      return;
    }


    const singer =
      document.getElementById('singer')
        .value.trim();

    const song =
      document.getElementById('song')
        .value.trim();

    const recorderName =
      document.getElementById('recorder')
        .value.trim();


    if (
      !singer ||
      !song ||
      !recorderName
    ) {

      setStatus(
        '⚠️ 資料不完整。'
      );

      return;
    }


    document
      .getElementById('send')
      .disabled = true;


    setStatus(
      '📤 正在傳回歌手資料庫……'
    );


    try {

      const dataUrl =
        await blobToDataUrl(
          audioBlob
        );


      // 從 GitHub 頁面
      // 傳回開啟它的 Apps Script 頁面

      if (!window.opener) {

        throw new Error(
          '請從歌手資料庫按「開啟錄音」進入錄音頁。'
        );

      }


      window.opener.postMessage(
        {
          type: 'SINGER_RECORDING',

          dataUrl: dataUrl,

          singer: singer,

          song: song,

          recorder: recorderName

        },

        'https://script.google.com'
      );


      setStatus(
        '✅ 已傳回歌手資料庫，請回上一個頁面等待儲存完成。'
      );


      setTimeout(
        function() {

          window.close();

        },
        1200
      );


    } catch (error) {

      document
        .getElementById('send')
        .disabled = false;


      setStatus(
        '❌ 傳送失敗：' +
        error.message
      );

    }

  }


  // =====================================
  // Blob → Base64
  // =====================================

  function blobToDataUrl(blob) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onloadend =
          function() {
            resolve(reader.result);
          };


        reader.onerror =
          reject;


        reader.readAsDataURL(blob);

      }
    );

  }


  // =====================================
  // 錄音格式
  // =====================================

  function getMimeType() {

    const types = [

      'audio/mp4',

      'audio/webm;codecs=opus',

      'audio/webm',

      'audio/ogg;codecs=opus'

    ];


    for (const type of types) {

      if (
        MediaRecorder.isTypeSupported(type)
      ) {
        return type;
      }

    }


    return '';

  }


  // =====================================
  // 計時
  // =====================================

  function updateTimer() {

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      seconds % 60;


    document
      .getElementById('timer')
      .textContent =
        String(minutes).padStart(2, '0') +
        ':' +
        String(secs).padStart(2, '0');


    seconds++;

  }


  // =====================================
  // 狀態
  // =====================================

  function setStatus(text) {

    document
      .getElementById('status')
      .textContent = text;

  }

</script>

</body>

</html>
