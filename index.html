<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎙️ 歌手資料庫錄音</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
      background: #f7f3ff;
      color: #333;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      padding: 24px 20px 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
      color: #7b4bb7;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: 600;
      color: #555;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
    }

    input:focus {
      border-color: #9b6bd3;
      background: white;
    }

    #startBtn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #8b5cc7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #f3eef9;
      text-align: center;
      color: #666;
      font-size: 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: #fff8e8;
      color: #806b38;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎙️ 歌手資料庫錄音</h1>

    <div class="subtitle">
      錄下你的版本，和大家一起收藏
    </div>

    <label for="singer">歌手</label>
    <input
      id="singer"
      type="text"
      placeholder="例如：單依純"
      autocomplete="off"
    >

    <label for="song">歌曲</label>
    <input
      id="song"
      type="text"
      placeholder="例如：喂"
      autocomplete="off"
    >

    <label for="recorder">錄音者</label>
    <input
      id="recorder"
      type="text"
      placeholder="輸入你的名字"
      autocomplete="off"
    >

    <button id="startBtn" onclick="startRecording()">
      🎙️ 開始錄音
    </button>

    <div id="status">
      最長錄音時間：20 秒
    </div>

    <div class="notice">
      📌 錄音最多 20 秒。<br>
      📌 錄音完成後會自動上傳。<br>
      📌 請先確認 Safari 已允許使用麥克風。
    </div>

  </div>


<script>

  /* =========================
     基本設定
  ========================= */

  const UPLOAD_URL =
    "https://script.google.com/macros/s/AKfycbzMO0D-Qd6reE74-NZSrLQanj-FI0UdnA2sK_lcNCz5R9KIIEYSchLvJFRsbva8rvbE2w/exec";

  let recorder = null;
  let chunks = [];
  let timer = null;
  let seconds = 0;


  /* =========================
     開始錄音
  ========================= */

  async function startRecording() {

    const singer =
      document.getElementById("singer").value.trim();

    const song =
      document.getElementById("song").value.trim();

    const recorderName =
      document.getElementById("recorder").value.trim();

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("startBtn");


    /* 檢查資料 */

    if (!singer || !song || !recorderName) {

      alert("請先填寫歌手、歌曲和錄音者名稱！");

      return;
    }


    /* 檢查 HTTPS */

    if (!window.isSecureContext) {

      status.innerText =
        "❌ 網站不是安全連線，無法使用麥克風";

      return;
    }


    /* 檢查麥克風 */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      status.innerText =
        "❌ 此瀏覽器無法使用麥克風";

      return;
    }


    /* 檢查錄音功能 */

    if (!window.MediaRecorder) {

      status.innerText =
        "❌ 此瀏覽器不支援錄音功能";

      return;
    }


    try {

      status.innerText =
        "🎙️ 正在開啟麥克風……";


      /*
        要求麥克風權限
      */

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      /*
        找 iPhone Safari 可以使用的格式
      */

      const mimeTypes = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm"
      ];

      let mimeType = "";


      if (
        typeof MediaRecorder.isTypeSupported ===
        "function"
      ) {

        for (const type of mimeTypes) {

          if (
            MediaRecorder.isTypeSupported(type)
          ) {

            mimeType = type;
            break;
          }
        }
      }


      /*
        建立錄音器
      */

      if (mimeType) {

        recorder =
          new MediaRecorder(
            stream,
            {
              mimeType: mimeType
            }
          );

      } else {

        recorder =
          new MediaRecorder(stream);
      }


      chunks = [];


      /*
        收集錄音資料
      */

      recorder.ondataavailable = function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          chunks.push(event.data);
        }
      };


      /*
        錄音結束
      */

      recorder.onstop = function() {

        clearInterval(timer);


        /*
          關閉麥克風
        */

        stream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });


        /*
          製作音檔
        */

        const blob =
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType ||
                mimeType ||
                "audio/mp4"
            }
          );


        status.innerText =
          "⌛ 正在準備上傳……";


        /*
          將音檔轉成 Base64
        */

        const reader =
          new FileReader();


        reader.onloadend = function() {

          const dataUrl =
            reader.result;


          sendRecording(
            dataUrl,
            singer,
            song,
            recorderName,
            blob.type
          );
        };


        reader.readAsDataURL(blob);
      };


      /*
        錄音錯誤
      */

      recorder.onerror = function(event) {

        console.error(
          "MediaRecorder error:",
          event
        );

        button.disabled = false;

        status.innerText =
          "❌ 錄音發生錯誤";
      };


      /*
        開始錄音
      */

      recorder.start(250);

      button.disabled = true;

      seconds = 0;

      status.innerText =
        "🔴 錄音中：0 / 20 秒";


      /*
        計時
      */

      timer =
        setInterval(function() {

          seconds++;

          status.innerText =
            "🔴 錄音中：" +
            seconds +
            " / 20 秒";


          /*
            20 秒自動停止
          */

          if (seconds >= 20) {

            stopRecording();
          }

        }, 1000);


    } catch (error) {

      console.error(
        "Microphone error:",
        error
      );

      button.disabled = false;


      /*
        把真正的錯誤告訴使用者
      */

      if (error.name === "NotAllowedError") {

        status.innerText =
          "❌ 麥克風權限被拒絕";

      } else if (
        error.name === "NotFoundError"
      ) {

        status.innerText =
          "❌ 找不到麥克風";

      } else if (
        error.name === "NotReadableError"
      ) {

        status.innerText =
          "❌ 麥克風目前被其他程式使用";

      } else {

        status.innerText =
          "❌ 麥克風啟動失敗：" +
          (error.name || error.message);
      }
    }
  }


  /* =========================
     停止錄音
  ========================= */

  function stopRecording() {

    clearInterval(timer);


    if (
      recorder &&
      recorder.state === "recording"
    ) {

      recorder.stop();
    }
  }


  /* =========================
     上傳錄音
  ========================= */

  function sendRecording(
    dataUrl,
    singer,
    song,
    recorderName,
    mimeType
  ) {

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("startBtn");


    status.innerText =
      "☁️ 正在上傳錄音……";


    /*
      根據實際格式決定副檔名
    */

    let extension = "mp4";

    if (
      mimeType &&
      mimeType.includes("webm")
    ) {

      extension = "webm";
    }


    /*
      建立檔名
    */

    const fileName =
      singer +
      "_" +
      song +
      "_" +
      recorderName +
      "." +
      extension;


    /*
      傳送到 Google Apps Script
    */

    fetch(
      UPLOAD_URL,
      {
        method: "POST",
        mode: "no-cors",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body:
          new URLSearchParams({

            dataUrl: dataUrl,

            fileName: fileName,

            singer: singer,

            song: song,

            recorder: recorderName

          })
      }
    )
    .then(function() {

      status.innerText =
        "✅ 錄音完成！已送出上傳";

      button.disabled = false;

    })
    .catch(function(error) {

      console.error(
        "Upload error:",
        error
      );

      status.innerText =
        "❌ 錄音上傳失敗，請再試一次";

      button.disabled = false;
    });
  }

</script>

</body>
</html>
