<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🎙️ 歌手資料庫錄音</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

      background: #f7f3ff;
      color: #333;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;

      background: white;

      border-radius: 24px;

      padding: 28px 20px 30px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;

      margin:
        5px 0 8px;

      color: #7b4bb7;

      font-size: 27px;
    }

    .subtitle {
      text-align: center;

      color: #888;

      font-size: 14px;

      margin-bottom: 28px;
    }

    label {
      display: block;

      margin-top: 16px;
      margin-bottom: 7px;

      font-weight: 600;

      color: #555;
    }

    input {
      width: 100%;

      padding: 14px;

      border:
        1px solid #ddd;

      border-radius: 13px;

      font-size: 16px;

      outline: none;

      background: #fafafa;
    }

    input:focus {
      border-color: #8b5cc7;

      background: white;
    }

    #startBtn {
      width: 100%;

      margin-top: 26px;

      padding: 16px;

      border: none;

      border-radius: 15px;

      background: #8b5cc7;

      color: white;

      font-size: 18px;

      font-weight: bold;
    }

    #startBtn:disabled {
      background: #aaa;
    }

    #status {
      margin-top: 18px;

      padding: 14px;

      min-height: 48px;

      border-radius: 13px;

      background: #f3eef9;

      color: #666;

      text-align: center;

      font-size: 14px;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .notice {
      margin-top: 18px;

      padding: 14px;

      border-radius: 13px;

      background: #fff8e8;

      color: #806b38;

      font-size: 13px;

      line-height: 1.7;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>🎙️ 歌手資料庫錄音</h1>

  <div class="subtitle">
    錄下你的版本，和大家一起收藏
  </div>


  <label for="singer">
    歌手
  </label>

  <input
    id="singer"
    type="text"
    placeholder="例如：周杰倫"
    autocomplete="off"
  >


  <label for="song">
    歌曲
  </label>

  <input
    id="song"
    type="text"
    placeholder="例如：稻香"
    autocomplete="off"
  >


  <label for="recorder">
    錄音者
  </label>

  <input
    id="recorder"
    type="text"
    placeholder="輸入你的名字"
    autocomplete="off"
  >


  <button
    id="startBtn"
    onclick="startRecording()"
  >
    🎙️ 開始錄音
  </button>


  <div id="status">
    錄音最多 20 秒
  </div>


  <div class="notice">

    📌 錄音最多 20 秒。<br>

    📌 錄音完成後會自動上傳。<br>

    📌 請先確認 Safari 已允許使用麥克風。

  </div>

</div>


<script>


/* =========================================
   Google Apps Script 網址
========================================= */

const UPLOAD_URL =
  "https://script.google.com/macros/s/AKfycbzMO0D-Qd6reE74-NZSrLQanj-FI0UdnA2sK_lcNCz5R9KIIEYSchLvJFRsbva8rvbE2w/exec";


/* =========================================
   錄音變數
========================================= */

let recorder = null;

let chunks = [];

let timer = null;

let seconds = 0;


/* =========================================
   開始錄音
========================================= */

async function startRecording() {

  const singer =
    document
      .getElementById("singer")
      .value
      .trim();

  const song =
    document
      .getElementById("song")
      .value
      .trim();

  const recorderName =
    document
      .getElementById("recorder")
      .value
      .trim();

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("startBtn");


  /* 檢查輸入 */

  if (
    !singer ||
    !song ||
    !recorderName
  ) {

    alert(
      "請先填寫歌手、歌曲和錄音者名稱！"
    );

    return;
  }


  /* 檢查麥克風 */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerText =
      "❌ 此瀏覽器無法使用麥克風";

    return;
  }


  /* 檢查錄音功能 */

  if (!window.MediaRecorder) {

    status.innerText =
      "❌ 此瀏覽器不支援錄音";

    return;
  }


  try {

    status.innerText =
      "🎙️ 正在開啟麥克風……";


    /* 要求麥克風權限 */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    /* =====================================
       選擇 iPhone 可以使用的音訊格式
    ===================================== */

    const formats = [

      "audio/mp4",

      "audio/webm;codecs=opus",

      "audio/webm"

    ];


    let mimeType = "";


    if (
      typeof MediaRecorder.isTypeSupported ===
      "function"
    ) {

      for (
        const format of formats
      ) {

        if (
          MediaRecorder
            .isTypeSupported(format)
        ) {

          mimeType = format;

          break;
        }
      }
    }


    /* 建立錄音器 */

    if (mimeType) {

      recorder =
        new MediaRecorder(
          stream,
          {
            mimeType: mimeType
          }
        );

    } else {

      recorder =
        new MediaRecorder(stream);
    }


    chunks = [];


    /* 收集錄音 */

    recorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          chunks.push(event.data);
        }

      };


    /* 錄音結束 */

    recorder.onstop =
      function() {

        clearInterval(timer);


        /* 關閉麥克風 */

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );


        /* 建立音檔 */

        const blob =
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType ||
                mimeType ||
                "audio/mp4"
            }
          );


        status.innerText =
          "⌛ 正在準備上傳……";


        /* 轉成 Base64 */

        const reader =
          new FileReader();


        reader.onloadend =
          function() {

            sendRecording(
              reader.result,
              singer,
              song,
              recorderName,
              blob.type
            );

          };


        reader.readAsDataURL(blob);

      };


    /* 錄音發生錯誤 */

    recorder.onerror =
      function(event) {

        console.error(event);

        button.disabled = false;

        status.innerText =
          "❌ 錄音發生錯誤";

      };


    /* 開始 */

    recorder.start(250);

    button.disabled = true;

    seconds = 0;


    status.innerText =
      "🔴 錄音中：0 / 20 秒";


    /* 計時 */

    timer =
      setInterval(
        function() {

          seconds++;


          status.innerText =
            "🔴 錄音中：" +
            seconds +
            " / 20 秒";


          /* 20 秒自動停止 */

          if (
            seconds >= 20
          ) {

            stopRecording();

          }

        },
        1000
      );


  } catch (error) {

    console.error(error);

    button.disabled = false;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      status.innerText =
        "❌ 麥克風權限被拒絕";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      status.innerText =
        "❌ 找不到麥克風";

    }

    else {

      status.innerText =
        "❌ 麥克風啟動失敗：" +
        (
          error.name ||
          error.message ||
          "未知錯誤"
        );

    }

  }

}


/* =========================================
   停止錄音
========================================= */

function stopRecording() {

  clearInterval(timer);


  if (
    recorder &&
    recorder.state ===
    "recording"
  ) {

    recorder.stop();

  }

}


/* =========================================
   上傳錄音
========================================= */

function sendRecording(
  dataUrl,
  singer,
  song,
  recorderName,
  mimeType
) {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("startBtn");


  status.innerText =
    "☁️ 正在上傳錄音……";


  /* =====================================
     判斷副檔名
  ===================================== */

  let extension = "mp4";


  if (
    mimeType &&
    mimeType.includes("webm")
  ) {

    extension = "webm";

  }


  /* 檔名 */

  const fileName =
    singer +
    "_" +
    song +
    "_" +
    recorderName +
    "." +
    extension;


  /* =====================================
     建立隱藏 iframe
  ===================================== */

  let iframe =
    document.getElementById(
      "uploadFrame"
    );


  if (!iframe) {

    iframe =
      document.createElement(
        "iframe"
      );

    iframe.id =
      "uploadFrame";

    iframe.name =
      "uploadFrame";

    iframe.style.display =
      "none";

    document.body.appendChild(
      iframe
    );

  }


  /* =====================================
     建立表單
  ===================================== */

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    UPLOAD_URL;


  form.target =
    "uploadFrame";


  form.style.display =
    "none";


  /* =====================================
     建立資料欄位
  ===================================== */

  const fields = {

    dataUrl:
      dataUrl,

    fileName:
      fileName,

    singer:
      singer,

    song:
      song,

    recorder:
      recorderName

  };


  for (
    const key in fields
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      key;


    input.value =
      fields[key];


    form.appendChild(
      input
    );

  }


  /* 加入頁面 */

  document.body.appendChild(
    form
  );


  /* =====================================
     真正送出 POST
  ===================================== */

  form.submit();


  /* =====================================
     顯示結果
  ===================================== */

  setTimeout(
    function() {

      status.innerText =
        "✅ 錄音已送出！";

      button.disabled =
        false;


      form.remove();

    },
    3000
  );

}


</script>

</body>

</html>
